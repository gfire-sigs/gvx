name: ext

# Builds, vets, and tests the nested Go extension submodule (ext/go.mod) with
# compile-time build tags (-tags ext_gpu and -tags ext_all), independently from
# the pure-Go core CI pipeline.
on:
  push:
    branches: [main]
    paths:
      - "ext/**"
      - "scripts/gpu/**"
      - "pkg/gvx/**"
      - "pkg/rungvx/**"
      - "pkg/sentry/fsimpl/sys/**"
      - "pkg/sentry/vfs/**"
      - "pkg/sentry/memmap/**"
      - "scripts/repro-build.sh"
      - "UPSTREAM_COMMIT"
      - ".github/workflows/ext.yml"
  pull_request:
    paths:
      - "ext/**"
      - "scripts/gpu/**"
      - "pkg/gvx/**"
      - "pkg/rungvx/**"
      - "pkg/sentry/fsimpl/sys/**"
      - "pkg/sentry/vfs/**"
      - "pkg/sentry/memmap/**"
      - "scripts/repro-build.sh"
      - "UPSTREAM_COMMIT"
      - ".github/workflows/ext.yml"
  workflow_dispatch:

concurrency:
  group: ext-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  build:
    name: build, vet, and repro ext
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Go formatting in ext
        run: |
          unformatted=$(gofmt -l ext)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Cross-compile ext across all target platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 windows/arm64 android/arm64; do
            echo "::group::build ext $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go -C ext build ./...
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go -C ext build -tags ext_gpu ./...
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go -C ext build -tags ext_all ./...
            echo "::endgroup::"
          done
      - name: Vet ext across all target platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::vet ext $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go -C ext vet -tags ext_all ./...
            echo "::endgroup::"
          done
      - name: Verify deterministic ext repro build and nginx-style version output
        run: |
          GVX_BUILD_TAGS=ext_gpu ./scripts/repro-build.sh /tmp/rungvx-ext-1 ./ext/cmd/rungvx
          GVX_BUILD_TAGS=ext_gpu ./scripts/repro-build.sh /tmp/rungvx-ext-2 ./ext/cmd/rungvx
          sha1=$(sha256sum /tmp/rungvx-ext-1 | awk '{ print $1 }')
          sha2=$(sha256sum /tmp/rungvx-ext-2 | awk '{ print $1 }')
          echo "ext repro sha256: $sha1"
          test "$sha1" = "$sha2"
          /tmp/rungvx-ext-1 version -V | tee /tmp/ext-version.txt
          grep -q "build options: cgo=0 tags=ext_gpu extensions=gpu" /tmp/ext-version.txt
          grep -q "spi: 1" /tmp/ext-version.txt
          grep -q "extension gpu: modes=venus,virgl" /tmp/ext-version.txt

          ./scripts/repro-build.sh /tmp/rungvx-pure ./cmd/rungvx
          /tmp/rungvx-pure version -V | tee /tmp/pure-version.txt
          grep -q "build options: cgo=0 tags=none extensions=none" /tmp/pure-version.txt
      - name: Audit boundaries including ext
        run: go run ./tools/upstream -mode=audit -max-ratio=0.045
      - name: Check license notices including renderer manifest
        run: go run ./tools/licenses -check

  # The renderer is C code with pinned inputs. Only changes to its code, build
  # scripts, Go GPU extension packages, or this workflow trigger the macOS build.
  gpu-changes:
    name: select gpu-renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=HEAD^1
          if [ "$EVENT" = push ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git fetch --depth=1 origin "$BEFORE"; then
              echo run=true >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base=$BEFORE
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(ext/workers/gpu-renderer/|ext/extensions/gpu/|scripts/gpu/|pkg/sentry/platform/hvf/|scripts/codesign-exec\.sh$|entitlements\.plist$|go\.(mod|sum)$|ext/go\.(mod|sum|work)$|\.github/workflows/ext\.yml$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  gpu-renderer:
    name: build gpu-renderer darwin/arm64
    needs: gpu-changes
    if: needs.gpu-changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GVX_ALLOW_NO_HYPERVISOR: "1"
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install the build tools
        run: brew install meson ninja pkgconf
      - name: Cache pinned renderer inputs
        uses: actions/cache@v6
        with:
          path: |
            build/gpu/cache
            !build/gpu/cache/driver-*
          key: gpu-renderer-${{ runner.os }}-${{ hashFiles('ext/workers/gpu-renderer/third_party.lock', 'scripts/gpu/stage_driver.py') }}
      - name: Build the renderer bundle
        run: scripts/gpu/build-renderer.sh
      - name: Run the renderer self-test
        if: vars.GVX_CI_METAL == '1'
        run: |
          build/gpu/gvx-gpu-renderer/bin/gvx-gpu-renderer --selftest
          build/gpu/gvx-gpu-renderer/bin/gvx-gpu-renderer --selftest --mode=virgl
      - name: Test the GPU extension packages with the renderer
        if: vars.GVX_CI_METAL == '1'
        run: |
          export GVX_GPU_RENDERER="$PWD/build/gpu/gvx-gpu-renderer/bin/gvx-gpu-renderer"
          go -C ext test -race -count=1 -tags ext_all -exec "$PWD/scripts/codesign-exec.sh" ./extensions/gpu/...
      - name: Report the skipped renderer tests
        if: vars.GVX_CI_METAL != '1'
        run: echo "::notice::GVX_CI_METAL is not 1, so the renderer self-test and the renderer tests did not run (see diagnose.yml)."

  test-linux:
    name: test ext linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GVX_E2E_OFFLINE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test ext with race detector
        run: go -C ext test -race -count=1 -tags ext_all ./...
      - name: Test ext pure-Go (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go -C ext test -count=1 -tags ext_all ./...

  test-darwin:
    name: test ext darwin/arm64
    runs-on: macos-26
    timeout-minutes: 25
    env:
      GVX_ALLOW_NO_HYPERVISOR: "1"
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test ext with race detector
        run: go -C ext test -race -count=1 -tags ext_all -exec "$PWD/scripts/codesign-exec.sh" ./...

  test-windows:
    name: test ext windows/amd64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test ext with race detector
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go -C ext test -race -count=1 -tags ext_all ./...
      - name: Test ext pure-Go (CGO_ENABLED=0)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go -C ext test -count=1 -tags ext_all ./...

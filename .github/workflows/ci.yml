name: ci

# The jobs cost little: they run on push to main and on pull requests, cancel
# superseded runs, skip documentation-only changes, and reuse the Go caches.
# Tests that pull real images run in e2e-images.yml, once a week or on demand.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/workflows/diagnose.yml", ".github/workflows/e2e-images.yml", ".github/workflows/pjdfstest.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/workflows/diagnose.yml", ".github/workflows/e2e-images.yml", ".github/workflows/pjdfstest.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job family: all, build, linux, darwin, or windows"
        type: choice
        default: all
        options: [all, build, linux, darwin, windows]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  # Packages that gvx owns or extends. The upstream gVisor trees have their own
  # tests, which the project does not run.
  OWNED: >-
    ./cmd/... ./internal/... ./tools/upstream/... ./pkg/gvx/... ./pkg/oci/...
    ./pkg/netbackend/... ./pkg/erofs/... ./pkg/sentry/fsimpl/erofs/...
    ./pkg/sentry/fsimpl/chunkcache/... ./pkg/sentry/fsimpl/hostfs/...
    ./pkg/syserr/... ./pkg/memutil/... ./pkg/fd/...
    ./pkg/sync/... ./pkg/sentry/pgalloc/... ./pkg/sentry/time/...
    ./pkg/sentry/hostcpu/... ./pkg/hostlockdown/... ./pkg/sentry/platform/hvcommon/...
    ./pkg/sentry/platform/hvf/... ./pkg/sentry/platform/whpx/... ./pkg/sentry/fsimpl/ext4lite/...
  # The owned packages that need no hypervisor and no 16KB build. On a hosted
  # macOS runner, pkg/gvx and cmd/rungv need the systrap engine instead.
  OWNED_PLAIN: >-
    ./internal/... ./tools/upstream/... ./pkg/oci/... ./pkg/netbackend/...
    ./pkg/erofs/... ./pkg/sentry/fsimpl/erofs/... ./pkg/sentry/fsimpl/chunkcache/...
    ./pkg/sentry/fsimpl/hostfs/... ./pkg/syserr/... ./pkg/memutil/... ./pkg/fd/... ./pkg/sync/...
    ./pkg/sentry/pgalloc/... ./pkg/sentry/time/... ./pkg/sentry/hostcpu/...
    ./pkg/hostlockdown/... ./pkg/sentry/platform/hvcommon/...
    ./pkg/sentry/platform/hvf/... ./pkg/sentry/platform/whpx/...
    ./pkg/sentry/fsimpl/ext4lite/...
  # Packages that gvx wrote. Upstream packages carry vet findings that the
  # project does not fix.
  VET: >-
    ./cmd/... ./internal/... ./tools/upstream/... ./pkg/gvx/... ./pkg/oci/...
    ./pkg/netbackend/... ./pkg/hostlockdown/... ./pkg/sentry/platform/hvcommon/...
    ./pkg/sentry/platform/hvf/... ./pkg/sentry/platform/whpx/...
    ./pkg/sentry/fsimpl/chunkcache/... ./pkg/sentry/fsimpl/hostfs/... ./pkg/syserr/...
    ./pkg/sentry/fsimpl/ext4lite/...
    ./e2e/...

jobs:
  build:
    name: build, vet, and audit
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l cmd e2e internal tools/upstream pkg/gvx pkg/oci pkg/netbackend \
            pkg/hostlockdown pkg/syserr pkg/sentry/platform/hvcommon pkg/sentry/platform/hvf \
            pkg/sentry/platform/whpx pkg/sentry/fsimpl/chunkcache pkg/sentry/fsimpl/hostfs \
            pkg/sentry/fsimpl/ext4lite)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Build all target platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::build $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
            echo "::endgroup::"
          done
          echo "::group::build darwin/arm64 with pagesize_16k"
          GOOS=darwin GOARCH=arm64 go build -tags pagesize_16k ./...
          echo "::endgroup::"
      - name: Vet all target platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::vet $target"
            GOOS=${target%/*} GOARCH=${target#*/} go vet $VET
            echo "::endgroup::"
          done
          # The systrap package mixes upstream Linux files with gvx files, so vet it where only gvx files build.
          for target in darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./pkg/sentry/platform/systrap/
          done
          GOOS=darwin GOARCH=arm64 go vet -tags pagesize_16k ./pkg/sentry/platform/... ./pkg/gvx/... ./e2e/...
      - name: Cache upstream archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/gvx/upstream
          key: upstream-${{ hashFiles('UPSTREAM_COMMIT') }}
      - name: Audit upstream diff
        run: go run ./tools/upstream -mode=audit -max-ratio=0.01

  linux:
    name: test linux/${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test owned packages
        env:
          EXT4LITE_REQUIRE_E2FSCK: "1"
          EXT4LITE_REQUIRE_LOOPMOUNT: "1"
        run: go test -race -count=1 $OWNED
      # The upstream systrap platform hangs while it starts in a cgo build, and
      # the race detector needs cgo. The steps below build without cgo.
      - name: Test systrap engine and end-to-end suite
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./pkg/hostlockdown/ ./pkg/gvx/ ./e2e/
      - name: Build rungv and smoke guest
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o rungv ./cmd/rungv
          go run ./internal/testelf/cmd/mkelf -o smoke.elf
      - name: Run smoke guest without lockdown
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          ./rungv stub
          ./rungv run -platform=systrap -net=none -lockdown=false -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out
      - name: Run smoke guest with lockdown
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          mkdir -p workspace
          ./rungv run -platform=auto -net=none -workspace=workspace -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out

  darwin-arm64:
    name: test darwin/arm64
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'darwin'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # A hosted runner is a virtual machine, so it cannot create a nested VM.
      # Tests that need Hypervisor.framework skip. The 16KB build runs the
      # same suites on the systrap engine, which needs no hypervisor.
      GVX_ALLOW_NO_HYPERVISOR: "1"
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test owned packages
        run: go test -race -count=1 -exec "$PWD/scripts/codesign-exec.sh" $OWNED_PLAIN
      - name: Test systrap engine and SDK (16KB pages)
        run: |
          go test -race -count=1 -tags pagesize_16k -exec "$PWD/scripts/codesign-exec.sh" \
            ./pkg/sentry/platform/systrap/... ./pkg/gvx/... ./cmd/...
      - name: Test systrap end-to-end suite
        run: |
          go test -count=1 -tags pagesize_16k -exec "$PWD/scripts/codesign-exec.sh" \
            -run 'TestE2ESystrap|TestE2ERungvSystrap' ./e2e

  windows-amd64:
    name: test windows/amd64
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test owned packages
        shell: bash
        run: go test -count=1 $OWNED
      - name: Test systrap engine and end-to-end suite
        shell: bash
        env:
          GVX_E2E_OFFLINE: "1"
        run: |
          go test -count=1 ./pkg/sentry/platform/systrap/
          go test -count=1 -run 'Systrap|systrap|Stub|HostLockdown' ./pkg/gvx/ ./cmd/rungv/ ./e2e/
      - name: Report runner hypervisor state
        shell: pwsh
        continue-on-error: true
        run: |
          Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform | Format-List FeatureName, State
          Get-CimInstance Win32_ComputerSystem | Format-List Model, HypervisorPresent
          Test-Path "$env:SystemRoot\System32\WinHvPlatform.dll"
      # The runner has the Windows Hypervisor Platform, so whpx must start.
      # GVX_DEBUG_LOG prints the Sentry log, which names the reason of a guest
      # crash.
      - name: Smoke test rungv guest on whpx
        shell: bash
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          go build -o rungv.exe ./cmd/rungv
          go run ./internal/testelf/cmd/mkelf -o smoke.elf
          ./rungv.exe run -platform=whpx -net=none -lockdown=false -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; cat smoke.out; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out
      # The hypervisor tests fail here and never skip, because
      # GVX_ALLOW_NO_HYPERVISOR is unset. The earlier step covers systrap.
      - name: Test whpx end-to-end suite
        shell: bash
        env:
          GVX_E2E_OFFLINE: "1"
        run: go test -count=1 -timeout 25m -skip 'Systrap|systrap' ./e2e/

  windows-arm64:
    name: test windows/arm64
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The hosted runner has no hypervisor, so the systrap engine is the only
      # backend that runs guests here.
      - name: Test shim control plane
        shell: bash
        run: go test -count=1 ./internal/gvxshim/ ./cmd/containerd-shim-gvx-v2/
      - name: Test systrap engine
        shell: bash
        run: go test -count=1 ./pkg/sentry/platform/systrap/
      - name: Test systrap end-to-end suite
        shell: bash
        env:
          GVX_E2E_OFFLINE: "1"
        run: go test -count=1 -run 'Systrap|systrap|Stub|HostLockdown' ./pkg/gvx/ ./cmd/rungv/ ./e2e/

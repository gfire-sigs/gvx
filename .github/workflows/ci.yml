name: ci

# The jobs cost little: they run on push to main and on pull requests, cancel
# superseded runs, skip documentation-only changes, and reuse the Go caches.
# Tests that pull real images run in e2e-images.yml, once a week or on demand.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "ext/**", ".github/workflows/benchmark.yml", ".github/workflows/diagnose.yml", ".github/workflows/e2e-images.yml", ".github/workflows/ext.yml", ".github/workflows/pjdfstest.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "ext/**", ".github/workflows/benchmark.yml", ".github/workflows/diagnose.yml", ".github/workflows/e2e-images.yml", ".github/workflows/ext.yml", ".github/workflows/pjdfstest.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job family: all, build, repro, dind, linux, darwin, or windows"
        type: choice
        default: all
        options: [all, build, repro, dind, linux, darwin, windows]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  # Packages that gvx owns or extends, split into disjoint shards so heavy
  # storage tests (ext4lite) and runtime tests (pkg/gvx) run in parallel.
  # scripts/check-ci-owned.sh verifies union coverage and disjointness.
  OWNED_STORAGE: >-
    ./pkg/sentry/fsimpl/cgroup2fs/... ./pkg/sentry/fsimpl/chunkcache/... ./pkg/sentry/fsimpl/devpts/... ./pkg/sentry/fsimpl/erofs/...
    ./pkg/sentry/fsimpl/ext4lite/... ./pkg/sentry/fsimpl/fsutilx/... ./pkg/sentry/fsimpl/hostfs/... ./pkg/sentry/fsimpl/iouringfs/...
    ./pkg/sentry/fsimpl/overlay/... ./pkg/sentry/fsimpl/proc/... ./pkg/sentry/fsimpl/rpcfs/... ./pkg/sentry/fsimpl/sys/...
  OWNED_RUNTIME: >-
    ./pkg/gvx/...
  OWNED_CORE: >-
    ./cmd/... ./internal/... ./tools/upstream/... ./tools/licenses/... ./tools/gvisorlint/... ./tools/gostateify/...
    ./pkg/rungvx/... ./pkg/oci/... ./pkg/netbackend/... ./pkg/hostlockdown/... ./pkg/ipset/... ./pkg/tcpip/link/vxlan/... ./pkg/tcpip/link/wgtun/...
    ./pkg/abi/linux/... ./pkg/cpuid/... ./pkg/erofs/... ./pkg/fd/... ./pkg/fdnotifier/... ./pkg/fsutil/... ./pkg/hostarch/...
    ./pkg/memutil/... ./pkg/rawfile/... ./pkg/ring0/... ./pkg/sync/... ./pkg/syserr/...
    ./pkg/sentry/arch/... ./pkg/sentry/blockdev/... ./pkg/sentry/devices/memdev/...
    ./pkg/sentry/hostcpu/... ./pkg/sentry/kernel/... ./pkg/sentry/loader/... ./pkg/sentry/mm/... ./pkg/sentry/pgalloc/... ./pkg/sentry/time/...
    ./pkg/sentry/platform ./pkg/sentry/platform/hvcommon/... ./pkg/sentry/platform/hvf/... ./pkg/sentry/platform/whpx/...
    ./pkg/sentry/socket/netfilter/... ./pkg/sentry/socket/netlink/... ./pkg/sentry/socket/netstack/...
    ./pkg/sentry/syscalls/linux/...
    ./pkg/tcpip ./pkg/tcpip/network/ipv4/... ./pkg/tcpip/network/ipv6/... ./pkg/tcpip/stack/... ./pkg/tcpip/transport/tcp/...
  # Packages that gvx wrote. Upstream packages carry vet findings that the
  # project does not fix.
  VET: >-
    ./cmd/... ./internal/... ./tools/upstream/... ./tools/licenses/... ./tools/gvisorlint/... ./tools/gostateify/...
    ./pkg/gvx/... ./pkg/rungvx/... ./pkg/oci/... ./pkg/netbackend/... ./pkg/hostlockdown/... ./pkg/ipset/... ./pkg/tcpip/link/vxlan/... ./pkg/tcpip/link/wgtun/...
    ./pkg/sentry/blockdev/... ./pkg/sentry/socket/netlink/genetlink/...
    ./pkg/sentry/platform/hvcommon/... ./pkg/sentry/platform/hvf/... ./pkg/sentry/platform/whpx/...
    ./pkg/sentry/fsimpl/chunkcache/... ./pkg/sentry/fsimpl/fsutilx/... ./pkg/sentry/fsimpl/hostfs/... ./pkg/syserr/...
    ./pkg/sentry/fsimpl/ext4lite/... ./pkg/sentry/fsimpl/rpcfs/...
    ./e2e/...

jobs:
  audit:
    name: audit and static checks
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l cmd e2e internal scripts tools/upstream tools/licenses tools/gvisorlint tools/androidprobe tools/gostateify \
            pkg/gvx pkg/rungvx pkg/oci pkg/netbackend pkg/hostlockdown pkg/syserr pkg/ipset pkg/tcpip/link/vxlan pkg/tcpip/link/wgtun \
            pkg/sentry/blockdev pkg/sentry/socket/netlink/genetlink pkg/sentry/platform/hvcommon \
            pkg/sentry/platform/hvf pkg/sentry/platform/whpx pkg/sentry/fsimpl/chunkcache \
            pkg/sentry/fsimpl/fsutilx pkg/sentry/fsimpl/hostfs pkg/sentry/fsimpl/ext4lite pkg/sentry/fsimpl/rpcfs)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Verify coverage of test packages
        run: ./scripts/check-ci-owned.sh
      - name: Check stateify generated files
        run: ./scripts/gostateify.sh -check
      - name: Test gVisor analyzer suite
        # The tool tests prove that a new violation fails the step. See docs/architecture.md.
        run: go test ./tools/gvisorlint/
      - name: Cache upstream archive
        uses: actions/cache@v6
        with:
          path: ~/.cache/gvx/upstream
          key: upstream-${{ hashFiles('UPSTREAM_COMMIT') }}
      - name: Audit upstream diff
        run: go run ./tools/upstream -mode=audit -max-ratio=0.045
      - name: Build a module that imports pkg/gvx
        run: ./scripts/check-consumer.sh
      - name: Check license notices
        run: go run ./tools/licenses -check
      - name: Select the shim interoperability module
        # The module tools/shiminterop has its own go.mod and imports no root package.
        # Only a change to the module or to this workflow can break it, so every other change skips it.
        id: shiminterop
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request checks out its merge commit, whose first parent is the base.
          base=HEAD^1
          if [ "$EVENT" = push ]; then
            git fetch --depth=1 origin "$BEFORE"
            base=$BEFORE
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(tools/shiminterop/|\.github/workflows/ci\.yml$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - name: Vet and test the shim interoperability module
        # Without GVX_SHIM_BINARY the test skips, but the module still compiles against the real SDK.
        if: steps.shiminterop.outputs.run == 'true'
        working-directory: tools/shiminterop
        run: |
          go vet ./...
          go test -count=1 ./...

  build:
    name: build, vet, and lint (${{ matrix.label }})
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/amd64
            targets: linux/amd64
            build_android: false
          - label: linux/arm64
            targets: linux/arm64
            build_android: false
          - label: darwin and android
            targets: darwin/arm64
            build_android: true
          - label: windows
            targets: windows/amd64 windows/arm64
            build_android: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and vet assigned targets
        # Running build, vet, and gvisorlint for one target in the same job reuses
        # the warmed Go build cache for that GOOS/GOARCH pair.
        run: |
          for target in ${{ matrix.targets }}; do
            goos=${target%/*}
            goarch=${target#*/}
            echo "::group::build $target"
            GOOS=$goos GOARCH=$goarch go build ./...
            echo "::endgroup::"

            echo "::group::vet $target"
            # The embedded copy of x/sys/unix keeps the unsafe.Pointer idioms of its upstream.
            export GOOS=$goos GOARCH=$goarch
            go vet $(go list $VET | grep -v '/internal/xsys/')
            if [ "$goos" = linux ]; then
              go vet ./tools/androidprobe/...
            else
              # The systrap package mixes upstream Linux files with gvx files, so vet it where only gvx files build.
              go vet ./pkg/sentry/platform/systrap/
            fi
            unset GOOS GOARCH
            echo "::endgroup::"
          done
      - name: Lint assigned targets with gVisor analyzers
        # Runs checklocks, checkconst, and checklinkname on every package of the assigned targets.
        run: scripts/gvisorlint.sh ${{ matrix.targets }}
      - name: Build android/arm64
        if: matrix.build_android
        run: |
          # Android uses the Linux code paths (docs/components/android.md).
          echo "::group::build android/arm64"
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./...
          echo "::endgroup::"

  linux:
    name: test linux/${{ matrix.arch }} (${{ matrix.shard }})
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            shard: storage
          - arch: amd64
            runner: ubuntu-24.04
            shard: runtime
          - arch: arm64
            runner: ubuntu-24.04-arm
            shard: storage
          - arch: arm64
            runner: ubuntu-24.04-arm
            shard: runtime
    env:
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test storage packages
        if: matrix.shard == 'storage'
        env:
          EXT4LITE_REQUIRE_E2FSCK: "1"
          EXT4LITE_REQUIRE_LOOPMOUNT: "1"
        run: go test -race -count=1 $OWNED_STORAGE
      - name: Test core and runtime packages
        if: matrix.shard == 'runtime'
        run: go test -race -count=1 $OWNED_CORE $OWNED_RUNTIME ./pkg/sentry/platform/systrap/...
      # The release builds without cgo, so the steps below do too. The race
      # step above runs the systrap package in a cgo build.
      - name: Test systrap engine and end-to-end suite
        if: matrix.shard == 'runtime'
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./pkg/hostlockdown/ ./pkg/gvx/ ./pkg/sentry/platform/systrap/ ./e2e/
      # A hosted runner has 4 KB pages. The variable runs the sub-block layer
      # of a 16 KB host (Android) under the guest probes.
      - name: Test the systrap sub-block layer
        if: matrix.shard == 'runtime' && matrix.arch == 'arm64'
        env:
          CGO_ENABLED: "0"
          GVX_SYSTRAP_SUBBLOCKS: "1"
        run: |
          go test -count=1 ./pkg/sentry/platform/systrap/
          go test -count=1 -run 'TestE2ESystrap|TestE2EGateETExec|TestE2EGateM2' ./e2e/
      - name: Build rungvx and the smoke guest
        if: matrix.shard == 'runtime'
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o rungvx ./cmd/rungvx
          ./rungvx version -V
          go run ./internal/testelf/cmd/mkelf -o smoke.elf
      - name: Run smoke guest without lockdown
        if: matrix.shard == 'runtime'
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          ./rungvx stub
          ./rungvx run -platform=systrap -net=none -lockdown=false -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out
      # A cgo build adds the thread start of the C library to the filter.
      - name: Run smoke guest with lockdown in a cgo build
        if: matrix.shard == 'runtime'
        env:
          CGO_ENABLED: "1"
          GVX_DEBUG_LOG: "1"
        run: |
          go build -o rungvx-cgo ./cmd/rungvx
          mkdir -p workspace-cgo
          ./rungvx-cgo run -platform=auto -net=none -workspace=workspace-cgo -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out
      - name: Run smoke guest with lockdown
        if: matrix.shard == 'runtime'
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          mkdir -p workspace
          ./rungvx run -platform=auto -net=none -workspace=workspace -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out

  darwin-arm64:
    name: test darwin/arm64 (${{ matrix.shard }})
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'darwin'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [storage, runtime]
    env:
      # A hosted runner is a virtual machine, so it cannot create a nested VM.
      # Tests that need Hypervisor.framework skip.
      GVX_ALLOW_NO_HYPERVISOR: "1"
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test storage packages
        if: matrix.shard == 'storage'
        run: go test -race -count=1 -exec "$PWD/scripts/codesign-exec.sh" $OWNED_STORAGE
      - name: Test core and runtime packages
        if: matrix.shard == 'runtime'
        run: go test -race -count=1 -exec "$PWD/scripts/codesign-exec.sh" $OWNED_CORE $OWNED_RUNTIME ./pkg/sentry/platform/systrap/...
      # macOS has no systrap engine and macos-26 offers no Hypervisor.framework,
      # so this step runs the host-level e2e gates that need no guest VM.
      - name: Test host-level end-to-end gates
        if: matrix.shard == 'runtime'
        run: go test -count=1 -exec "$PWD/scripts/codesign-exec.sh" -run '^TestE2E(OtherOSHypervisorFailsExplicitly|SystrapPrerequisiteError|RungvxConfigurationErrors)$' ./e2e/

  windows-amd64:
    name: test windows/amd64 (${{ matrix.shard }})
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [storage, core, e2e]
    env:
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The race detector needs cgo. The runner image has gcc from MinGW.
      - name: Test storage packages
        if: matrix.shard == 'storage'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 20m $OWNED_STORAGE
      - name: Test core and runtime packages
        if: matrix.shard == 'core'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 20m $OWNED_CORE $OWNED_RUNTIME
      - name: Test systrap engine
        if: matrix.shard == 'core'
        shell: bash
        run: go test -count=1 ./pkg/sentry/platform/systrap/
      - name: Report runner hypervisor state
        if: matrix.shard == 'e2e'
        shell: pwsh
        continue-on-error: true
        run: |
          Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform | Format-List FeatureName, State
          Get-CimInstance Win32_ComputerSystem | Format-List Model, HypervisorPresent
          Test-Path "$env:SystemRoot\System32\WinHvPlatform.dll"
      - name: Build rungvx and the smoke guest
        if: matrix.shard == 'e2e'
        shell: bash
        run: |
          go build -o rungvx.exe ./cmd/rungvx
          ./rungvx.exe version -V
          go run ./internal/testelf/cmd/mkelf -o smoke.elf
      # The runner has the Windows Hypervisor Platform, so whpx must start.
      # GVX_DEBUG_LOG prints the Sentry log, which names the reason of a guest
      # crash.
      - name: Run smoke guest on whpx
        if: matrix.shard == 'e2e'
        shell: bash
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          ./rungvx.exe run -platform=whpx -net=none -lockdown=false -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; cat smoke.out; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out
      # The suite runs each test on whpx and on systrap. The hypervisor tests
      # fail here and never skip, because GVX_ALLOW_NO_HYPERVISOR is unset.
      - name: Test end-to-end suite
        if: matrix.shard == 'e2e'
        shell: bash
        run: go test -count=1 -timeout 25m ./pkg/gvx/ ./pkg/rungvx/ ./cmd/rungvx/ ./e2e/

  windows-arm64:
    name: test windows/arm64 (${{ matrix.shard }})
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, runtime, e2e]
    # The hosted runner has no hypervisor. The job runs the same tests as
    # windows/amd64 on the systrap engine, and the whpx subtests skip.
    # Go has no race detector on windows/arm64, so each package runs once.
    env:
      GVX_ALLOW_NO_HYPERVISOR: "1"
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test storage, core, and systrap packages
        if: matrix.shard == 'unit'
        shell: bash
        run: go test -count=1 -timeout 20m $OWNED_STORAGE $OWNED_CORE ./pkg/sentry/platform/systrap/
      - name: Test runtime packages
        if: matrix.shard == 'runtime'
        shell: bash
        run: go test -count=1 -timeout 20m $OWNED_RUNTIME
      - name: Build rungvx and the smoke guest
        if: matrix.shard == 'runtime'
        shell: bash
        run: |
          go build -o rungvx.exe ./cmd/rungvx
          ./rungvx.exe version -V
          go run ./internal/testelf/cmd/mkelf -o smoke.elf
      - name: Run smoke guest on systrap
        if: matrix.shard == 'runtime'
        shell: bash
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          ./rungvx.exe run -platform=systrap -net=none -lockdown=false -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; cat smoke.out; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out
      - name: Test end-to-end suite
        if: matrix.shard == 'e2e'
        shell: bash
        run: go test -count=1 -timeout 25m ./e2e/

  repro:
    name: reproducible build in gvx
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'repro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache Go image layers for gvx
        uses: actions/cache@v6
        with:
          path: ~/.cache/gvx/repro-layers
          key: gvx-repro-golang-${{ hashFiles('go.mod') }}-${{ runner.arch }}
      - name: Build rungvx in gvx Go image and compare SHA-256
        env:
          GVX_REPRO_PLATFORM: systrap
        run: GVX_REPRO_CACHE_DIR="$HOME/.cache/gvx/repro-layers" ./scripts/verify-repro-gvx.sh

  dind-build:
    name: docker build in gvx dind
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'dind'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache docker:dind layers for gvx
        uses: actions/cache@v6
        with:
          path: ~/.cache/gvx/dind-layers
          key: gvx-dind-layers-v1-${{ runner.arch }}
      - name: Run local-registry docker build inside gvx dind
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$HOME/.cache/gvx/dind-layers"
          GVX_E2E_DIND_CACHE_DIR="$HOME/.cache/gvx/dind-layers" go test -v -count=1 -timeout 15m -run '^TestE2EDockerBuildDindLocalRegistry$' ./e2e

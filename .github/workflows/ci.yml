name: ci

# The jobs cost little: they run on push to main and on pull requests, cancel
# superseded runs, skip documentation-only changes, and reuse the Go caches.
# Tests that pull real images run in e2e-images.yml, once a week or on demand.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/workflows/benchmark.yml", ".github/workflows/diagnose.yml", ".github/workflows/e2e-images.yml", ".github/workflows/pjdfstest.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/workflows/benchmark.yml", ".github/workflows/diagnose.yml", ".github/workflows/e2e-images.yml", ".github/workflows/pjdfstest.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job family: all, build, repro, linux, darwin, or windows"
        type: choice
        default: all
        options: [all, build, repro, linux, darwin, windows]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  # Packages that gvx owns or extends. The upstream gVisor trees have their own
  # tests, which the project does not run.
  OWNED: >-
    ./cmd/... ./internal/... ./tools/upstream/... ./tools/licenses/... ./tools/gvisorlint/... ./tools/gostateify/...
    ./pkg/gvx/... ./pkg/oci/... ./pkg/netbackend/... ./pkg/hostlockdown/... ./pkg/ipset/... ./pkg/tcpip/link/vxlan/...
    ./pkg/abi/linux/... ./pkg/cpuid/... ./pkg/erofs/... ./pkg/fd/... ./pkg/fdnotifier/... ./pkg/fsutil/... ./pkg/hostarch/...
    ./pkg/memutil/... ./pkg/rawfile/... ./pkg/ring0/... ./pkg/sync/... ./pkg/syserr/...
    ./pkg/sentry/arch/... ./pkg/sentry/blockdev/... ./pkg/sentry/devices/memdev/...
    ./pkg/sentry/fsimpl/cgroup2fs/... ./pkg/sentry/fsimpl/chunkcache/... ./pkg/sentry/fsimpl/erofs/...
    ./pkg/sentry/fsimpl/ext4lite/... ./pkg/sentry/fsimpl/hostfs/... ./pkg/sentry/fsimpl/iouringfs/...
    ./pkg/sentry/fsimpl/overlay/... ./pkg/sentry/fsimpl/proc/... ./pkg/sentry/fsimpl/sys/...
    ./pkg/sentry/hostcpu/... ./pkg/sentry/kernel/... ./pkg/sentry/loader/... ./pkg/sentry/mm/... ./pkg/sentry/pgalloc/... ./pkg/sentry/time/...
    ./pkg/sentry/platform ./pkg/sentry/platform/hvcommon/... ./pkg/sentry/platform/hvf/... ./pkg/sentry/platform/whpx/...
    ./pkg/sentry/socket/netfilter/... ./pkg/sentry/socket/netlink/... ./pkg/sentry/socket/netstack/...
    ./pkg/sentry/syscalls/linux/...
    ./pkg/tcpip ./pkg/tcpip/network/ipv4/... ./pkg/tcpip/network/ipv6/... ./pkg/tcpip/stack/... ./pkg/tcpip/transport/tcp/...
  # Packages that gvx wrote. Upstream packages carry vet findings that the
  # project does not fix.
  VET: >-
    ./cmd/... ./internal/... ./tools/upstream/... ./tools/licenses/... ./tools/gvisorlint/... ./tools/gostateify/...
    ./pkg/gvx/... ./pkg/oci/... ./pkg/netbackend/... ./pkg/hostlockdown/... ./pkg/ipset/... ./pkg/tcpip/link/vxlan/...
    ./pkg/sentry/blockdev/... ./pkg/sentry/socket/netlink/genetlink/...
    ./pkg/sentry/platform/hvcommon/... ./pkg/sentry/platform/hvf/... ./pkg/sentry/platform/whpx/...
    ./pkg/sentry/fsimpl/chunkcache/... ./pkg/sentry/fsimpl/hostfs/... ./pkg/syserr/...
    ./pkg/sentry/fsimpl/ext4lite/...
    ./e2e/...

jobs:
  build:
    name: build, vet, and audit
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l cmd e2e internal scripts tools/upstream tools/licenses tools/gvisorlint tools/androidprobe tools/gostateify \
            pkg/gvx pkg/oci pkg/netbackend pkg/hostlockdown pkg/syserr pkg/ipset pkg/tcpip/link/vxlan \
            pkg/sentry/blockdev pkg/sentry/socket/netlink/genetlink pkg/sentry/platform/hvcommon \
            pkg/sentry/platform/hvf pkg/sentry/platform/whpx pkg/sentry/fsimpl/chunkcache \
            pkg/sentry/fsimpl/hostfs pkg/sentry/fsimpl/ext4lite)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Verify coverage of test packages
        run: ./scripts/check-ci-owned.sh
      - name: Check stateify generated files
        run: ./scripts/gostateify.sh -check
      - name: Build all target platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::build $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
            echo "::endgroup::"
          done
          # Android uses the Linux code paths (docs/gvxip/gvxip-006-android-host-support.md).
          echo "::group::build android/arm64"
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build ./...
          echo "::endgroup::"
      - name: Vet all target platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::vet $target"
            # The embedded copy of x/sys/unix keeps the unsafe.Pointer idioms of its upstream.
            export GOOS=${target%/*} GOARCH=${target#*/}
            go vet $(go list $VET | grep -v '/internal/xsys/')
            if [ "$GOOS" = linux ]; then
              go vet ./tools/androidprobe/...
            fi
            unset GOOS GOARCH
            echo "::endgroup::"
          done
          # The systrap package mixes upstream Linux files with gvx files, so vet it where only gvx files build.
          for target in darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./pkg/sentry/platform/systrap/
          done
      - name: Lint with the gVisor analyzers
        # Runs checklocks, checkconst, and checklinkname on every package of the five targets.
        # The tool tests prove that a new violation fails the step. See docs/gvisorlint.md.
        run: |
          go test ./tools/gvisorlint/
          scripts/gvisorlint.sh
      - name: Cache upstream archive
        uses: actions/cache@v6
        with:
          path: ~/.cache/gvx/upstream
          key: upstream-${{ hashFiles('UPSTREAM_COMMIT') }}
      - name: Audit upstream diff
        run: go run ./tools/upstream -mode=audit -max-ratio=0.042
      - name: Build a module that imports pkg/gvx
        run: ./scripts/check-consumer.sh
      - name: Check license notices
        run: go run ./tools/licenses -check

  linux:
    name: test linux/${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test owned packages
        env:
          EXT4LITE_REQUIRE_E2FSCK: "1"
          EXT4LITE_REQUIRE_LOOPMOUNT: "1"
        run: go test -race -count=1 $OWNED ./pkg/sentry/platform/systrap/...
      # The release builds without cgo, so the steps below do too. The race
      # step above runs the systrap package in a cgo build.
      - name: Test systrap engine and end-to-end suite
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./pkg/hostlockdown/ ./pkg/gvx/ ./pkg/sentry/platform/systrap/ ./e2e/
      # A hosted runner has 4 KB pages. The variable runs the sub-block layer
      # of a 16 KB host (Android) under the guest probes.
      - name: Test the systrap sub-block layer
        if: matrix.arch == 'arm64'
        env:
          CGO_ENABLED: "0"
          GVX_SYSTRAP_SUBBLOCKS: "1"
        run: |
          go test -count=1 ./pkg/sentry/platform/systrap/
          go test -count=1 -run 'TestE2ESystrap|TestE2EGateETExec|TestE2EGateM2' ./e2e/
      - name: Build rungv and the smoke guest
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o rungv ./cmd/rungv
          go run ./internal/testelf/cmd/mkelf -o smoke.elf
      - name: Run smoke guest without lockdown
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          ./rungv stub
          ./rungv run -platform=systrap -net=none -lockdown=false -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out
      # A cgo build adds the thread start of the C library to the filter.
      - name: Run smoke guest with lockdown in a cgo build
        env:
          CGO_ENABLED: "1"
          GVX_DEBUG_LOG: "1"
        run: |
          go build -o rungv-cgo ./cmd/rungv
          mkdir -p workspace-cgo
          ./rungv-cgo run -platform=auto -net=none -workspace=workspace-cgo -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out
      - name: Run smoke guest with lockdown
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          mkdir -p workspace
          ./rungv run -platform=auto -net=none -workspace=workspace -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out

  darwin-arm64:
    name: test darwin/arm64
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'darwin'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # A hosted runner is a virtual machine, so it cannot create a nested VM.
      # Tests that need Hypervisor.framework skip.
      GVX_ALLOW_NO_HYPERVISOR: "1"
      GVX_E2E_OFFLINE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test owned packages
        run: go test -race -count=1 -exec "$PWD/scripts/codesign-exec.sh" $OWNED ./pkg/sentry/platform/systrap/...
      # macOS has no systrap engine and macos-15 offers no Hypervisor.framework,
      # so this step runs the host-level e2e gates that need no guest VM.
      - name: Test host-level end-to-end gates
        run: go test -count=1 -exec "$PWD/scripts/codesign-exec.sh" -run '^TestE2E(OtherOSHypervisorFailsExplicitly|SystrapPrerequisiteError|RungvConfigurationErrors)$' ./e2e/

  windows-amd64:
    name: test windows/amd64
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The race detector needs cgo. The runner image has gcc from MinGW.
      - name: Test owned packages
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 $OWNED
      - name: Test systrap engine
        shell: bash
        run: go test -count=1 ./pkg/sentry/platform/systrap/
      - name: Report runner hypervisor state
        shell: pwsh
        continue-on-error: true
        run: |
          Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform | Format-List FeatureName, State
          Get-CimInstance Win32_ComputerSystem | Format-List Model, HypervisorPresent
          Test-Path "$env:SystemRoot\System32\WinHvPlatform.dll"
      - name: Build rungv and the smoke guest
        shell: bash
        run: |
          go build -o rungv.exe ./cmd/rungv
          go run ./internal/testelf/cmd/mkelf -o smoke.elf
      # The runner has the Windows Hypervisor Platform, so whpx must start.
      # GVX_DEBUG_LOG prints the Sentry log, which names the reason of a guest
      # crash.
      - name: Run smoke guest on whpx
        shell: bash
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          ./rungv.exe run -platform=whpx -net=none -lockdown=false -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; cat smoke.out; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out
      # The suite runs each test on whpx and on systrap. The hypervisor tests
      # fail here and never skip, because GVX_ALLOW_NO_HYPERVISOR is unset.
      - name: Test end-to-end suite
        shell: bash
        env:
          GVX_E2E_OFFLINE: "1"
        run: go test -count=1 -timeout 25m ./pkg/gvx/ ./cmd/rungv/ ./e2e/

  windows-arm64:
    name: test windows/arm64
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-11-arm
    timeout-minutes: 40
    # The hosted runner has no hypervisor. The job runs the same tests as
    # windows/amd64 on the systrap engine, and the whpx subtests skip.
    env:
      GVX_ALLOW_NO_HYPERVISOR: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Go has no race detector for windows/arm64, so this step runs
      # without -race.
      - name: Test owned packages
        shell: bash
        run: go test -count=1 $OWNED
      - name: Test execution backends
        shell: bash
        run: go test -count=1 ./pkg/sentry/platform/whpx/ ./pkg/sentry/platform/systrap/
      - name: Build rungv and the smoke guest
        shell: bash
        run: |
          go build -o rungv.exe ./cmd/rungv
          go run ./internal/testelf/cmd/mkelf -o smoke.elf
      - name: Run smoke guest on systrap
        shell: bash
        env:
          GVX_DEBUG_LOG: "1"
        run: |
          ./rungv.exe run -platform=systrap -net=none -lockdown=false -bin=smoke.elf > smoke.out 2> smoke.err || { cat smoke.err; cat smoke.out; exit 1; }
          cat smoke.out
          grep -q gvx-smoke-ok smoke.out
      - name: Test end-to-end suite
        shell: bash
        env:
          GVX_E2E_OFFLINE: "1"
        run: go test -count=1 -timeout 25m ./pkg/gvx/ ./cmd/rungv/ ./e2e/

  repro:
    name: reproducible build in gvx
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'repro'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache Go image layers for gvx
        uses: actions/cache@v6
        with:
          path: ~/.cache/gvx/repro-layers
          key: gvx-repro-golang-${{ hashFiles('go.mod') }}-${{ runner.arch }}
      - name: Build rungv in gvx Go image and compare SHA-256
        env:
          GVX_REPRO_PLATFORM: systrap
        run: GVX_REPRO_CACHE_DIR="$HOME/.cache/gvx/repro-layers" ./scripts/verify-repro-gvx.sh

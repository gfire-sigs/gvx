name: diagnose

# Manual runs of a chosen test selection on a chosen hosted runner. A developer
# uses it to see how code behaves on a host that the developer does not have,
# for example Windows, without running the whole suite.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Hosted runner"
        type: choice
        default: windows-latest
        options: [windows-latest, windows-11-arm, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
      packages:
        description: "Package patterns for go test"
        default: ./pkg/sentry/fsimpl/hostfs/...
      run:
        description: "Value of go test -run (empty runs every test)"
        default: ""
      tags:
        description: "Value of go test -tags (empty for none)"
        default: ""
      script:
        description: "Bash script to run instead of go test (empty runs go test)"
        default: ""

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GVX_DEBUG_LOG: "1"
  GVX_ALLOW_NO_HYPERVISOR: "1"
  GVX_E2E_OFFLINE: "1"

jobs:
  test:
    name: go test on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run the selected tests
        shell: bash
        env:
          PACKAGES: ${{ inputs.packages }}
          RUN: ${{ inputs.run }}
          TAGS: ${{ inputs.tags }}
          SCRIPT: ${{ inputs.script }}
        run: |
          if [ -n "$SCRIPT" ]; then
            bash -c "$SCRIPT"
            exit $?
          fi
          args=(-count=1 -v)
          [ -n "$RUN" ] && args+=(-run "$RUN")
          [ -n "$TAGS" ] && args+=(-tags "$TAGS")
          if [ "$RUNNER_OS" = macOS ]; then
            args+=(-exec "$PWD/scripts/codesign-exec.sh")
          fi
          go test "${args[@]}" $PACKAGES
      - name: Show crash reports and sandbox denials of the run
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          sysctl machdep.cpu.brand_string hw.pagesize
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$f" ] || continue
            echo "== $f"
            python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          header, _, body = raw.partition("\n")
          try:
              d = json.loads(body)
          except Exception as e:
              print("unreadable:", e); sys.exit(0)
          for k in ("procName", "exception", "termination"):
              print(k, d.get(k))
          for th in d.get("threads", []):
              if th.get("triggered"):
                  for fr in th["frames"][:6]:
                      print("  ", fr.get("symbol"), fr.get("imageOffset"))
          PY
          done
          log show --last 10m --style compact --predicate 'eventMessage CONTAINS "Sandbox:" AND eventMessage CONTAINS "deny"' | grep -v "kern.hv_vmm_present\|/private/etc/passwd\|/usr/bin/true\|/bin/sh\|remote:\*:1" | tail -40 || true

name: pjdfstest

# Runs the POSIX file system conformance suite (pjdfstest) inside rungv guests
# on linux/amd64, linux/arm64, windows/amd64, and windows/arm64. The select job
# picks the drivers from the changed paths: ext4lite volumes for
# pkg/sentry/fsimpl/ext4lite, hostfs volumes for pkg/sentry/fsimpl/hostfs, and
# both for the harness. scripts/pjdfstest/known-failures.txt lists host limits.
on:
  push:
    branches: [main]
    paths:
      - "pkg/sentry/fsimpl/ext4lite/**"
      - "pkg/sentry/fsimpl/hostfs/**"
      - "scripts/pjdfstest/**"
      - "internal/pjdfsreport/**"
      - ".github/workflows/pjdfstest.yml"
  pull_request:
    paths:
      - "pkg/sentry/fsimpl/ext4lite/**"
      - "pkg/sentry/fsimpl/hostfs/**"
      - "scripts/pjdfstest/**"
      - "internal/pjdfsreport/**"
      - ".github/workflows/pjdfstest.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job family: all, linux, or windows"
        type: choice
        default: all
        options: [all, linux, windows]
      fs:
        description: "File system driver: all, ext4lite, or hostfs"
        type: choice
        default: all
        options: [all, ext4lite, hostfs]

concurrency:
  group: pjdfstest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  select:
    name: select drivers
    runs-on: ubuntu-24.04
    outputs:
      fs: ${{ steps.pick.outputs.fs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Pick drivers from the changed paths
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FS: ${{ inputs.fs }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$INPUT_FS" in
              ext4lite) echo 'fs=["ext4lite"]' >>"$GITHUB_OUTPUT" ;;
              hostfs) echo 'fs=["hostfs"]' >>"$GITHUB_OUTPUT" ;;
              *) echo 'fs=["ext4lite","hostfs"]' >>"$GITHUB_OUTPUT" ;;
            esac
            exit 0
          fi
          # A pull request checks out its merge commit, whose first parent is the base.
          base=HEAD^1
          if [ "$EVENT" = push ]; then
            git fetch --depth=1 origin "$BEFORE"
            base=$BEFORE
          fi
          changed=$(git diff --name-only "$base" HEAD)
          printf '%s\n' "$changed"
          ext4lite=false
          hostfs=false
          if printf '%s\n' "$changed" | grep -qE '^(scripts/pjdfstest/|internal/pjdfsreport/|\.github/workflows/pjdfstest\.yml$)'; then
            ext4lite=true
            hostfs=true
          fi
          if printf '%s\n' "$changed" | grep -q '^pkg/sentry/fsimpl/ext4lite/'; then ext4lite=true; fi
          if printf '%s\n' "$changed" | grep -q '^pkg/sentry/fsimpl/hostfs/'; then hostfs=true; fi
          list=""
          if [ "$ext4lite" = true ]; then list='"ext4lite"'; fi
          if [ "$hostfs" = true ]; then list="${list:+$list,}\"hostfs\""; fi
          echo "fs=[$list]" >>"$GITHUB_OUTPUT"

  bundle:
    name: bundle linux/${{ matrix.arch }}
    needs: select
    if: needs.select.outputs.fs != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build rungv
        env:
          CGO_ENABLED: "0"
        run: go build -o rungv ./cmd/rungv
      - name: Build pjdfstest bundle inside guest
        env:
          GOMAXPROCS: "1"
        run: |
          ./scripts/pjdfstest/build-bundle.sh ./rungv "$PWD/cache" "$PWD/bundle"
          e2fsck -fn "$PWD/cache/volumes/pjdfs_build.ext4"
      - name: Upload guest-built pjdfstest bundle
        uses: actions/upload-artifact@v7
        with:
          name: pjdfstest-bundle-${{ matrix.arch }}
          path: bundle/

  linux:
    name: pjdfstest ${{ matrix.fs }} linux/${{ matrix.arch }}
    needs: [select, bundle]
    if: needs.select.outputs.fs != '[]' && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fs: ${{ fromJSON(needs.select.outputs.fs) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build rungv
        env:
          CGO_ENABLED: "0"
        run: go build -o rungv ./cmd/rungv
      - name: Download pjdfstest bundle
        uses: actions/download-artifact@v8
        with:
          name: pjdfstest-bundle-${{ matrix.arch }}
          path: bundle
      - name: Run pjdfstest inside guests
        env:
          GOMAXPROCS: "1"
        run: ./scripts/pjdfstest/run.sh ./rungv "$PWD/cache" "$PWD/bundle" ${{ matrix.fs }} vol "$PWD/out"
      - name: Compare with the known failures
        run: go run ./internal/pjdfsreport -fs ${{ matrix.fs }} -os linux -known scripts/pjdfstest/known-failures.txt out/worker_*.log
      - name: Check the ext4lite volumes
        if: matrix.fs == 'ext4lite'
        run: |
          for w in 1 2 3 4; do
            e2fsck -fn "$PWD/cache/volumes/pjdfs_vol_$w.ext4"
          done
      - name: Upload guest logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pjdfstest-logs-${{ matrix.fs }}-linux-${{ matrix.arch }}
          path: out/worker_*.log

  windows:
    name: pjdfstest ${{ matrix.fs }} windows/${{ matrix.arch }}
    needs: [select, bundle]
    if: needs.select.outputs.fs != '[]' && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fs: ${{ fromJSON(needs.select.outputs.fs) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      GVX_ALLOW_NO_HYPERVISOR: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download pjdfstest bundle
        uses: actions/download-artifact@v8
        with:
          name: pjdfstest-bundle-${{ matrix.arch }}
          path: bundle
      - name: Build rungv
        shell: bash
        run: go build -o rungv.exe ./cmd/rungv
      - name: Run pjdfstest inside guests
        shell: bash
        run: ./scripts/pjdfstest/run.sh ./rungv.exe ./cache ./bundle ${{ matrix.fs }} tmp ./out
      - name: Compare with the known failures
        shell: bash
        run: go run ./internal/pjdfsreport -fs ${{ matrix.fs }} -os windows -known scripts/pjdfstest/known-failures.txt out/worker_*.log
      - name: Upload guest logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pjdfstest-logs-${{ matrix.fs }}-windows-${{ matrix.arch }}
          path: out/worker_*.log

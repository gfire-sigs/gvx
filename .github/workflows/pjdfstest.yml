name: pjdfstest

# Runs the POSIX filesystem conformance suite (pjdfstest) inside a rungv guest
# mounted on an ext4lite volume across all five target platforms whenever
# pkg/sentry/fsimpl/ext4lite changes (on push, pull_request, or manual dispatch).
on:
  push:
    branches: [main]
    paths:
      - "pkg/sentry/fsimpl/ext4lite/**"
      - ".github/workflows/pjdfstest.yml"
  pull_request:
    paths:
      - "pkg/sentry/fsimpl/ext4lite/**"
      - ".github/workflows/pjdfstest.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job family: all, linux, or windows"
        type: choice
        default: all
        options: [all, linux, windows]

concurrency:
  group: pjdfstest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  linux:
    name: pjdfstest linux/${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux' || inputs.only == 'windows'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build rungv
        env:
          CGO_ENABLED: "0"
        run: go build -o rungv ./cmd/rungv
      - name: Build pjdfstest bundle inside guest
        env:
          GOMAXPROCS: "1"
        run: |
          mkdir -p "$PWD/bundle" "$PWD/cache"
          ./rungv run -platform=systrap -cache-dir="$PWD/cache" -workspace="$PWD/bundle" -v pjdfs_build:/mnt/vol alpine:3.20 sh -c '
            set -e
            apk add --no-cache git build-base autoconf automake perl perl-utils >/dev/null
            git clone --depth=1 https://github.com/pjd/pjdfstest.git /mnt/vol/pjdfstest
            cd /mnt/vol/pjdfstest
            autoreconf -ifs
            CFLAGS="-O2 -Wl,-z,max-page-size=65536" ./configure >/dev/null
            make pjdfstest >/dev/null
            cp -r /mnt/vol/pjdfstest/* /workspace/
          '
          cat > "$PWD/bundle/tests/conf" <<'EOF'
          os="Linux"
          GREP="grep"
          fs="EXT4"
          EOF
          sed -i 's/dir=`dirname \$0`/dir=${0%\/*}/g' "$PWD/bundle/tests"/*/*.t
          sed -i '/^confdir=/,/^fstest=/c\confdir="${dir}/.."\nmaindir="${dir}/../.."\nfstest="${maindir}/pjdfstest"' "$PWD/bundle/tests/misc.sh"
          cat >> "$PWD/bundle/tests/misc.sh" <<'EOF'

          _nl='
          '
          expect()
          {
          	e="${1}"
          	shift
          	r=$(${fstest} $* 2>/dev/null)
          	r=${r##*$_nl}
          	_m=1
          	case "${e}" in
          	*'('*|*'*'*|*'['*|*'.'*|*'+'*|*'?'*|*'^'*|*'$'*)
          		echo "${r}" | ${GREP} -Eq '^'${e}'$' && _m=0
          		;;
          	*)
          		case "|${e}|" in
          		*"|${r}|"*) _m=0 ;;
          		esac
          		;;
          	esac
          	if [ $_m -eq 0 ]; then
          		if [ -z "${todomsg}" ]; then
          			echo "ok ${ntest}"
          		else
          			echo "ok ${ntest} # TODO ${todomsg}"
          		fi
          	else
          		if [ -z "${todomsg}" ]; then
          			echo "not ok ${ntest} - tried '$*', expected ${e}, got ${r}"
          		else
          			echo "not ok ${ntest} # TODO ${todomsg}"
          		fi
          	fi
          	todomsg=""
          	: $(( ntest += 1 ))
          }

          namegen()
          {
          	read _u < /proc/sys/kernel/random/uuid
          	while [ "${_u#*-}" != "$_u" ]; do _u="${_u%%-*}${_u#*-}"; done
          	echo "pjdfstest_${_u}"
          }

          namegen_len()
          {
          	len="${1}"
          	name=""
          	while [ ${#name} -lt ${len} ]; do
          		read _u < /proc/sys/kernel/random/uuid
          		while [ "${_u#*-}" != "$_u" ]; do _u="${_u%%-*}${_u#*-}"; done
          		name="${name}${_u}"
          	done
          	while [ ${#name} -gt ${len} ]; do
          		name="${name%?}"
          	done
          	printf "%s" "${name}"
          }
          EOF
          e2fsck -fn "$PWD/cache/volumes/pjdfs_build.ext4"
      - name: Upload guest-built pjdfstest bundle
        uses: actions/upload-artifact@v4
        with:
          name: pjdfstest-bundle-${{ matrix.arch }}
          path: bundle/
      - name: Run pjdfstest inside guest on ext4lite volumes
        if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
        env:
          GOMAXPROCS: "1"
        run: |
          run_worker() {
            w="$1"
            shift
            cp -r "$PWD/bundle" "$PWD/bundle_$w"
            ./rungv run -platform=systrap -cache-dir="$PWD/cache" -workspace="$PWD/bundle_$w" -ro -v "pjdfs_vol_$w:/mnt/vol" alpine:3.20 sh -c '
              set -e
              cp -r /workspace /mnt/vol/pjdfstest
              chmod +x /mnt/vol/pjdfstest/pjdfstest
              for suite in "$@"; do
                [ -d "/mnt/vol/pjdfstest/tests/$suite" ] || continue
                mkdir -p "/mnt/vol/work/$suite"
                cd "/mnt/vol/work/$suite"
                for t in /mnt/vol/pjdfstest/tests/"$suite"/*.t; do
                  rc=0
                  out=$(sh "$t") || rc=$?
                  plan=$(printf "%s\n" "$out" | sed -n "s/^1\.\.\([0-9][0-9]*\).*/\1/p" | head -n 1)
                  ok_cnt=$(printf "%s\n" "$out" | grep -cE "^(ok |not ok [0-9]+ # TODO)" || true)
                  bad=$(printf "%s\n" "$out" | grep -E "^not ok" | grep -v "# TODO" || true)
                  if [ "$rc" -ne 0 ] || [ -z "$plan" ] || [ -n "$bad" ] || [ "$ok_cnt" -ne "$plan" ]; then
                    echo "FAIL: $t (rc=$rc plan=$plan ok=$ok_cnt)"
                    printf "%s\n" "$bad"
                    exit 1
                  fi
                  echo "PASS: $t ($ok_cnt/$plan)"
                done
              done
            ' sh "$@"
          }
          run_worker 1 chown &
          p1=$!
          run_worker 2 rename &
          p2=$!
          run_worker 3 chmod link mknod open ftruncate &
          p3=$!
          run_worker 4 chflags mkdir mkfifo posix_fallocate rmdir symlink truncate unlink utimensat &
          p4=$!
          rc=0
          for p in $p1 $p2 $p3 $p4; do wait "$p" || rc=1; done
          [ "$rc" -eq 0 ]
          for w in 1 2 3 4; do
            e2fsck -fn "$PWD/cache/volumes/pjdfs_vol_$w.ext4"
          done

  windows:
    name: pjdfstest windows/${{ matrix.arch }}
    needs: linux
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      GVX_ALLOW_NO_HYPERVISOR: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download pjdfstest bundle
        uses: actions/download-artifact@v4
        with:
          name: pjdfstest-bundle-${{ matrix.arch }}
          path: bundle
      - name: Build rungv
        shell: bash
        run: go build -o rungv.exe ./cmd/rungv
      - name: Run pjdfstest on ext4lite volume
        shell: bash
        run: |
          mkdir -p ./cache
          ./rungv.exe pull -cache-dir=./cache alpine:3.20
          run_worker() {
            w="$1"
            shift
            cp -r ./bundle "./bundle_$w"
            ./rungv.exe run -platform=systrap -cache-dir=./cache -workspace="./bundle_$w" -ro -v "pjdfs_vol_$w:/mnt/vol" alpine:3.20 sh -c '
              set -e
              cp -r /workspace /tmp/pjdfstest
              chmod +x /tmp/pjdfstest/pjdfstest
              for suite in "$@"; do
                [ -d "/tmp/pjdfstest/tests/$suite" ] || continue
                mkdir -p "/mnt/vol/work/$suite"
                cd "/mnt/vol/work/$suite"
                for t in /tmp/pjdfstest/tests/"$suite"/*.t; do
                  rc=0
                  out=$(sh "$t") || rc=$?
                  plan=$(printf "%s\n" "$out" | sed -n "s/^1\.\.\([0-9][0-9]*\).*/\1/p" | head -n 1)
                  ok_cnt=$(printf "%s\n" "$out" | grep -cE "^(ok |not ok [0-9]+ # TODO)" || true)
                  bad=$(printf "%s\n" "$out" | grep -E "^not ok" | grep -v "# TODO" || true)
                  if [ "$rc" -ne 0 ] || [ -z "$plan" ] || [ -n "$bad" ] || [ "$ok_cnt" -ne "$plan" ]; then
                    echo "FAIL: $t (rc=$rc plan=$plan ok=$ok_cnt)"
                    printf "%s\n" "$bad"
                    exit 1
                  fi
                  echo "PASS: $t ($ok_cnt/$plan)"
                done
              done
            ' sh "$@"
          }
          run_worker 1 chown &
          p1=$!
          run_worker 2 rename &
          p2=$!
          run_worker 3 chmod link mknod open ftruncate &
          p3=$!
          run_worker 4 chflags mkdir mkfifo posix_fallocate rmdir symlink truncate unlink utimensat &
          p4=$!
          rc=0
          for p in $p1 $p2 $p3 $p4; do wait "$p" || rc=1; done
          [ "$rc" -eq 0 ]

name: e2e-images

# These tests pull real images from Docker Hub, so they run once a week and on
# demand instead of on every push. The Linux jobs run every gate on the
# upstream systrap platform with the seccomp lockdown, because Linux has no
# hypervisor backend. The Windows jobs run the systrap variants on the engine
# of gvx. The windows-latest runner also runs the whpx variants. The
# windows-11-arm runner has no hypervisor.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job family: all, linux, or windows"
        type: choice
        default: all
        options: [all, linux, windows]

concurrency:
  group: e2e-images
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  linux:
    name: test linux/${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GVX_E2E_REQUIRE_NETWORK: "1"
      # The upstream systrap platform hangs while it starts in a cgo build.
      CGO_ENABLED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test end-to-end registry gates
        run: go test -count=1 -timeout 50m -skip '^TestE2EK3s' ./e2e
      # The k3s tests of GVXIP-005 sections 4.2 and 4.3 run in their own step,
      # so that their time does not count against the other gates.
      - name: Test k3s nodes
        run: go test -count=1 -timeout 120m -run '^TestE2EK3s(SingleNode|Calico|MultiNode(T1Join|T2Join|ControlPlaneFailover))$' ./e2e
      # C3 installs k3s on the runner with sudo. The step joins a gvx agent
      # to that server. GVXIP-005 section 4.3 names the test.
      - name: Test a gvx agent against a native k3s server
        env:
          GVX_E2E_NATIVE_K3S: "1"
        run: go test -count=1 -timeout 30m -run '^TestE2EK3sMultiNodeMixedKernels$' ./e2e
      # C5 takes the most time of the multi-node tests, so only one
      # architecture runs it.
      - name: Test Kubernetes conformance
        if: matrix.arch == 'amd64'
        env:
          GVX_E2E_CONFORMANCE: "1"
        run: go test -count=1 -timeout 80m -run '^TestE2EK3sConformance' ./e2e

  windows:
    name: test windows/${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      GVX_ALLOW_NO_HYPERVISOR: "1"
      GVX_E2E_REQUIRE_NETWORK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test end-to-end registry gates
        shell: bash
        run: |
          go test -count=1 -timeout 80m \
            -run 'TestE2ESystrap|TestE2EGateM3(Alpine|NginxPortForward|PythonAlpine|NodeAlpine)/systrap|TestE2EGateM4(PosixTortureBusybox|GitWorkloads|NodeModulesTorture)/systrap|TestE2EStdioReopenThroughDeviceNames/systrap' \
            ./e2e
          go test -count=1 -timeout 30m -run 'TestE2EDockerRun.*/systrap' ./e2e
          go test -count=1 -timeout 40m -run 'TestE2EGateETExec.*/systrap' ./e2e
          go test -count=1 -timeout 40m -run 'TestE2EGateJVM/systrap' ./e2e
      # The whpx backend runs one partition in each process, so the tests with
      # several sandboxes run on systrap only.
      - name: Test k3s nodes
        shell: bash
        run: go test -count=1 -timeout 90m -run '^TestE2EK3s(SingleNode|Calico|MultiNode(T1Join|T2Join))$/^systrap$' ./e2e
      # Each -run value has one slash, so the pattern before it selects the
      # test and the pattern after it selects the subtest. The step fails
      # instead of skipping when whpx does not start, because
      # GVX_ALLOW_NO_HYPERVISOR is 0 here.
      - name: Test end-to-end registry gates on whpx
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          GVX_ALLOW_NO_HYPERVISOR: "0"
        run: |
          go test -count=1 -timeout 80m \
            -run '^(TestE2EGateM3(Alpine|NginxPortForward|PythonAlpine|NodeAlpine)|TestE2EGateM4(PosixTortureBusybox|GitWorkloads|NodeModulesTorture)|TestE2EStdioReopenThroughDeviceNames)$/^whpx$' \
            ./e2e
          go test -count=1 -timeout 30m -run '^(TestE2EDockerRun.*|TestE2EMemoryCgroup.*)$/^whpx$' ./e2e
          go test -count=1 -timeout 40m -run '^TestE2EGateETExec.*$/^whpx$' ./e2e
          go test -count=1 -timeout 40m -run '^TestE2EGateJVM$/^whpx$' ./e2e
          go test -count=1 -timeout 40m -run '^TestE2EK3sSingleNode$/^whpx$' ./e2e

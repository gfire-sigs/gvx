name: e2e-images

# These tests pull real images from Docker Hub, so they run once a week and on
# demand instead of on every push. The hosted macOS runner has no hypervisor.
# The macOS job runs the systrap variants of the gates, which need none. The
# Linux jobs run every gate on the upstream systrap platform with the seccomp
# lockdown, because Linux has no hypervisor backend. The Windows jobs run the
# systrap variants on the engine of gvx. The windows-latest runner also runs
# the whpx variants. The windows-11-arm runner has no hypervisor.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: "Run one job family: all, linux, darwin, or windows"
        type: choice
        default: all
        options: [all, linux, darwin, windows]

concurrency:
  group: e2e-images
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  linux:
    name: test linux/${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GVX_E2E_REQUIRE_NETWORK: "1"
      # The upstream systrap platform hangs while it starts in a cgo build.
      CGO_ENABLED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test end-to-end registry gates
        run: go test -count=1 -timeout 50m ./e2e

  darwin-arm64:
    name: test darwin/arm64
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'darwin'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GVX_ALLOW_NO_HYPERVISOR: "1"
      GVX_E2E_REQUIRE_NETWORK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test end-to-end registry gates
        run: |
          go test -count=1 -timeout 80m -tags pagesize_16k \
            -exec "$PWD/scripts/codesign-exec.sh" \
            -run 'TestE2ESystrap|TestE2EGateM3(Alpine|NginxPortForward|PythonAlpine|NodeAlpine)/systrap|TestE2EGateM4(PosixTortureBusybox|GitWorkloads|NodeModulesTorture)/systrap|TestE2EStdioReopenThroughDeviceNames/systrap' \
            ./e2e
          go test -count=1 -timeout 30m -tags pagesize_16k \
            -exec "$PWD/scripts/codesign-exec.sh" \
            -run 'TestE2EDockerRun.*/systrap' ./e2e

  windows:
    name: test windows/${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      GVX_ALLOW_NO_HYPERVISOR: "1"
      GVX_E2E_REQUIRE_NETWORK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test end-to-end registry gates
        shell: bash
        run: |
          go test -count=1 -timeout 80m \
            -run 'TestE2ESystrap|TestE2EGateM3(Alpine|NginxPortForward|PythonAlpine|NodeAlpine)/systrap|TestE2EGateM4(PosixTortureBusybox|GitWorkloads|NodeModulesTorture)/systrap|TestE2EStdioReopenThroughDeviceNames/systrap' \
            ./e2e
          go test -count=1 -timeout 30m -run 'TestE2EDockerRun.*/systrap' ./e2e
          go test -count=1 -timeout 40m -run 'TestE2EGateETExec.*/systrap' ./e2e
      # Each -run value has one slash, so the pattern before it selects the
      # test and the pattern after it selects the subtest. The step fails
      # instead of skipping when whpx does not start, because
      # GVX_ALLOW_NO_HYPERVISOR is 0 here.
      - name: Test end-to-end registry gates on whpx
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          GVX_ALLOW_NO_HYPERVISOR: "0"
        run: |
          go test -count=1 -timeout 80m \
            -run '^(TestE2EGateM3(Alpine|NginxPortForward|PythonAlpine|NodeAlpine)|TestE2EGateM4(PosixTortureBusybox|GitWorkloads|NodeModulesTorture)|TestE2EStdioReopenThroughDeviceNames)$/^whpx$' \
            ./e2e
          go test -count=1 -timeout 30m -run '^TestE2EDockerRun.*$/^whpx$' ./e2e
          go test -count=1 -timeout 40m -run '^TestE2EGateETExec.*$/^whpx$' ./e2e

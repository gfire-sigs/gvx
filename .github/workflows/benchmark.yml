name: benchmark

# Runs the cross-platform micro-benchmark suite (TestE2EMicroBench) across
# Linux, Windows, and macOS runners and records the latency and host CPU
# utilization trend on the bench-results branch.
on:
  push:
    branches: [main]
    # Run only for changes that can move the numbers. The weekly run covers
    # the rest, and AGENTS.md section 5.1 asks for low CI usage.
    paths:
      - "pkg/sentry/platform/**"
      - "pkg/sentry/pgalloc/**"
      - "pkg/sentry/kernel/**"
      - "pkg/sentry/mm/**"
      - "pkg/hostlockdown/**"
      - "pkg/gvx/**"
      - "internal/xsys/**"
      - "internal/acceptprog/microbench/**"
      - "internal/benchreport/**"
      - "e2e/microbench_e2e_test.go"
      - "e2e/bench_cpu_*.go"
      - ".github/workflows/benchmark.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      repeat:
        description: "Number of repetitions per benchmark (GVX_E2E_BENCH_REPEAT)"
        default: "3"
        type: string

# One run at a time for each ref. A new run waits and does not cancel the
# running one. GitHub keeps only the newest waiting run.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GVX_E2E_OFFLINE: "1"

jobs:
  bench:
    name: bench ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            allow_no_hv: "0"
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            allow_no_hv: "0"
          - os: windows
            arch: amd64
            runner: windows-latest
            allow_no_hv: "0"
          - os: windows
            arch: arm64
            runner: windows-11-arm
            allow_no_hv: "1"
          - os: darwin
            arch: arm64
            runner: macos-15
            allow_no_hv: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run micro-benchmarks
        shell: bash
        env:
          CGO_ENABLED: "0"
          GVX_E2E_BENCH: "1"
          GVX_E2E_BENCH_REPEAT: ${{ inputs.repeat || '3' }}
          GVX_ALLOW_NO_HYPERVISOR: ${{ matrix.allow_no_hv }}
        run: |
          set -o pipefail
          args=(-count=1 -timeout 25m -v -run TestE2EMicroBench)
          if [ "$RUNNER_OS" = macOS ]; then
            args+=(-exec "$PWD/scripts/codesign-exec.sh")
          fi
          go test "${args[@]}" ./e2e/ | tee "bench-${{ matrix.os }}-${{ matrix.arch }}.log"
      - name: Upload benchmark log
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-${{ matrix.arch }}
          path: bench-${{ matrix.os }}-${{ matrix.arch }}.log
          if-no-files-found: error

  publish:
    name: publish results to bench-results
    needs: bench
    # Publish the platforms that finished, also when one platform failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs of different refs share the one results branch.
    concurrency:
      group: benchmark-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download benchmark logs
        uses: actions/download-artifact@v4
        with:
          path: bench-artifacts
          merge-multiple: true
      - name: Update bench-results branch
        shell: bash
        env:
          BENCH_COMMIT: ${{ github.sha }}
          BENCH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go build -o benchreport ./internal/benchreport
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each attempt builds the files again on top of the newest branch, so
          # a push that lost a race never needs a merge of generated files.
          for attempt in 1 2 3; do
            rm -rf bench-results-tree
            git worktree prune
            if git fetch origin "+refs/heads/bench-results:refs/remotes/origin/bench-results" 2>/dev/null; then
              git worktree add --detach bench-results-tree origin/bench-results
            else
              git worktree add --detach bench-results-tree
              git branch -D bench-results-new >/dev/null 2>&1 || true
              git -C bench-results-tree checkout --orphan bench-results-new
              git -C bench-results-tree rm -rf . >/dev/null 2>&1 || true
            fi
            ./benchreport \
              -input-dir bench-artifacts \
              -outdir bench-results-tree \
              -commit "$BENCH_COMMIT" \
              -branch "$BENCH_BRANCH"
            git -C bench-results-tree add history.ndjson latest.json README.md
            if git -C bench-results-tree diff --cached --quiet; then
              echo "No benchmark changes to commit."
              exit 0
            fi
            git -C bench-results-tree commit -q -m "chore(bench): record benchmark results for ${BENCH_COMMIT:0:8}"
            if git -C bench-results-tree push origin HEAD:refs/heads/bench-results; then
              exit 0
            fi
            echo "push attempt $attempt lost a race; retrying" >&2
          done
          echo "could not push to bench-results after 3 attempts" >&2
          exit 1

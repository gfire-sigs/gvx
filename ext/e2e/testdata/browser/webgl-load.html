<!doctype html>
<!--
  gvx WebGL load page for the browser benchmark. Query parameters:
    frames  number of frames (default 60)
    n       number of triangles in each frame (default 20000)
    size    edge of each triangle in clip space (default 0.05)
    iters   iterations of the fragment shader loop (default 16)
    sync    1 draws frames in a loop without requestAnimationFrame, so the
            60 Hz frame clock does not bound the result
  Each frame reads one pixel back, which waits for the frame to finish.
  The page prints one line that starts with "LOAD " and ends with "done".
-->
<html><head><meta charset="utf-8"><title>gvx-webgl-load</title></head>
<body style="margin:0"><canvas id="c" width="1024" height="768"></canvas><pre id="out">pending</pre>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const FRAMES = Number(q.get('frames') || 60);
  const N = Number(q.get('n') || 20000);
  const SIZE = Number(q.get('size') || 0.05);
  const ITERS = Number(q.get('iters') || 16);
  const out = document.getElementById('out');
  const gl = document.getElementById('c').getContext('webgl', {antialias: false});
  if (!gl) { out.textContent = 'LOAD context=none done'; return; }
  const vs = 'precision highp float; attribute vec2 p; uniform float t; varying vec2 uv;' +
    'void main() { float a = t * 0.01; mat2 r = mat2(cos(a), -sin(a), sin(a), cos(a));' +
    ' uv = p; gl_Position = vec4(r * p, 0.0, 1.0); }';
  const fs = 'precision highp float; varying vec2 uv; uniform float t;' +
    'void main() { float s = 0.0; for (int i = 0; i < ' + ITERS + '; i++) {' +
    ' s += sin(uv.x * float(i) * 3.0 + t * 0.05) * cos(uv.y * float(i) * 2.0); }' +
    ' gl_FragColor = vec4(0.5 + 0.5 * sin(s), 0.5 + 0.5 * cos(s), 0.5, 1.0); }';
  function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    out.textContent = 'LOAD link=' + gl.getProgramInfoLog(prog) + ' done';
    return;
  }
  gl.useProgram(prog);
  // A fixed-seed generator gives the same geometry on every run.
  let seed = 1;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647 * 2 - 1;
  const data = new Float32Array(N * 6);
  for (let i = 0; i < N; i++) {
    const x = rnd(), y = rnd();
    data.set([x, y, x + SIZE, y, x, y + SIZE], i * 6);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const lp = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(lp);
  gl.vertexAttribPointer(lp, 2, gl.FLOAT, false, 0, 0);
  const lt = gl.getUniformLocation(prog, 't');
  const px = new Uint8Array(4);
  let f = 0;
  function draw() {
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(lt, f);
    gl.drawArrays(gl.TRIANGLES, 0, N * 3);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    f++;
  }
  function finish() {
    const c = new Uint8Array(4);
    gl.readPixels(512, 384, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, c);
    out.textContent = 'LOAD frames=' + FRAMES + ' ms=' + Math.round(performance.now() - t0) +
      ' px=' + Array.from(c).join(',') + ' err=' + gl.getError() + ' done';
  }
  const t0 = performance.now();
  if (q.get('sync') === '1') {
    while (f < FRAMES) draw();
    finish();
    return;
  }
  (function frame() { draw(); if (f < FRAMES) requestAnimationFrame(frame); else finish(); })();
})();
</script></body></html>
